services:
  db:
    image: pgvector/pgvector:pg16
    ports:
      - "127.0.0.1:55432:5432"
    environment:
      POSTGRES_DB: jurix_audit
      POSTGRES_USER: jurix_audit
      POSTGRES_PASSWORD: audit-only-local-fixture
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jurix_audit -d jurix_audit"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - audit_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:16380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    entrypoint: ["/usr/local/bin/jurix-runtime"]
    command: celery -A config worker -l warning --pool=solo --concurrency=1
    environment:
      DATABASE_URL: postgresql://jurix_audit:audit-only-local-fixture@db:5432/jurix_audit
      REDIS_URL: redis://redis:6379/0
      CACHE_REDIS_URL: redis://redis:6379/1
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SECRET_KEY: audit-only-local-secret-not-for-production
      DEBUG: "True"
      USE_LOCMEM_CACHE: "False"
      CELERY_TASK_ALWAYS_EAGER: "False"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping --timeout=5 | grep -q pong"]
      interval: 15s
      timeout: 8s
      retries: 3
      start_period: 20s

volumes:
  audit_pgdata:
