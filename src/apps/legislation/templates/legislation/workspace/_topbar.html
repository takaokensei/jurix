<header class="workspace-topbar figma-header-row" role="banner">
    <button type="button"
            class="workspace-mobile-toggle toggle-sidebar jurix-icon-button"
            id="toggle-sidebar"
            data-workspace-toggle
            aria-controls="sidebar"
            aria-expanded="false"
            aria-label="Recolher navegação"
            title="Recolher navegação">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
    </button>
    <div class="workspace-breadcrumb figma-left-indicator">
        <span>Jurix</span>
        <span aria-hidden="true">/</span>
        <strong>{{ topbar_section|default:'Workspace' }}</strong>
    </div>
    <button type="button"
            class="workspace-top-search figma-system-search"
            id="command-palette-trigger"
            data-open-command-palette
            aria-label="Abrir busca rápida (Ctrl K)">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.35-4.35"></path>
        </svg>
        <span class="figma-search-placeholder">Buscar normas ou consultas...</span>
        <span class="figma-shortcut-badge figma-shortcut-badge-push">Ctrl K</span>
    </button>
</header>
