# Jurix Infrastructure Configuration
# Docker Compose setup for Jurix legal consolidation system
# Services: PostgreSQL (pgvector), Redis, Django Web, Celery Worker

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: jurix_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jurix}
      POSTGRES_USER: ${POSTGRES_USER:-jurix_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jurix_pass_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jurix_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: jurix_redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: jurix_web
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-jurix_user}:${POSTGRES_PASSWORD:-jurix_pass_dev}@db:5432/${POSTGRES_DB:-jurix}
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=llama3
      - DJANGO_SETTINGS_MODULE=config.settings
      - DEBUG=${DEBUG:-False}
      - CACHE_REDIS_URL=redis://redis:6379/1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live/')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: jurix_worker
    restart: unless-stopped
    command: celery -A config worker -l info --pool=prefork --concurrency=4 --max-tasks-per-child=100
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-jurix_user}:${POSTGRES_PASSWORD:-jurix_pass_dev}@db:5432/${POSTGRES_DB:-jurix}
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=llama3
      - DJANGO_SETTINGS_MODULE=config.settings
      - DEBUG=${DEBUG:-False}
      - CACHE_REDIS_URL=redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  beat:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: celery -A config beat -l info --schedule=/tmp/jurix-celerybeat
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-jurix_user}:${POSTGRES_PASSWORD:-jurix_pass_dev}@db:5432/${POSTGRES_DB:-jurix}
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_SETTINGS_MODULE=config.settings
      - DEBUG=${DEBUG:-False}
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:

