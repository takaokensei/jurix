name: Complete Claude Audit Refactor

on:
  push:
    branches: [fix/claude-audit-complete]

permissions:
  contents: write

jobs:
  refactor:
    if: ${{ !contains(github.event.head_commit.message, '[skip audit-refactor]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/claude-audit-complete
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate audit refactors
        run: |
          python scripts/refactor_ingestion_tasks.py
          python scripts/refactor_api_and_sapl.py
          python scripts/apply_audit_hygiene.py
      - name: Commit generated refactors
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: complete Claude audit fixes [skip audit-refactor]' || exit 0
          git push origin HEAD:fix/claude-audit-complete
