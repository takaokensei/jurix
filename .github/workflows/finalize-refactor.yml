name: Finalize Refactor
on:
  push:
    branches: [fix/claude-audit-complete]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[skip finalize]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/claude-audit-complete}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q ruff
      - run: python scripts/fix_generated_imports.py
      - run: ruff check src/apps/ingestion src/apps/legislation/api_*.py src/clients/sapl --fix || true
      - run: ruff format src/apps/ingestion src/apps/legislation/api_*.py src/clients/sapl
      - run: python -m compileall -q src
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: finalize generated module imports [skip finalize]' || exit 0
          git push origin HEAD:fix/claude-audit-complete
