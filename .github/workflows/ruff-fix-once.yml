name: Ruff Fix Once
on:
  push:
    branches: [fix/claude-audit-complete]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[skip ruff-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q ruff
      - run: python scripts/final_ruff_fix.py
      - run: python -m ruff check .
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: resolve ruff violations [skip ruff-fix]' || exit 0
          git push origin HEAD:fix/claude-audit-complete
