name: Refactor Lint Fix
on:
  push:
    branches: [fix/claude-audit-complete]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[skip lint-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/claude-audit-complete}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/fix_refactor_ruff.py
      - run: python -m compileall -q src
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: fix refactor lint [skip lint-fix]' || exit 0
          git push origin HEAD:fix/claude-audit-complete
