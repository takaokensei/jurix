name: Audit Refactor Runner

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/claude-audit-complete

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate ingestion modules
        run: python scripts/refactor_ingestion_tasks.py

      - name: Commit generated modules to audit branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/apps/ingestion scripts/refactor_ingestion_tasks.py
          git commit -m 'refactor: split ingestion tasks by domain [skip audit-refactor]' || exit 0
          git push origin HEAD:fix/claude-audit-complete
