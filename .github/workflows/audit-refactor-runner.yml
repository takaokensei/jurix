name: Audit Refactor Runner
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/claude-audit-complete}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/final_ruff_fix.py
      - run: python -m ruff check .
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: resolve final ruff violations [skip audit-refactor]' || exit 0
          git push origin HEAD:fix/claude-audit-complete

