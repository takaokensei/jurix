name: One-shot audit formatter
on:
  push:
    branches: [fix/claude-audit-complete]
permissions:
  contents: write
jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[skip audit-format]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q ruff==0.8.4
      - run: ruff format src/apps/ingestion/core_tasks.py src/apps/ingestion/tasks.py
      - name: Commit formatted files and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/apps/ingestion/core_tasks.py src/apps/ingestion/tasks.py
          git commit -m 'style: format ingestion facades [skip audit-format]' || true
          rm -f .github/workflows/format-audit-files.yml
          git add -A
          git commit -m 'chore: remove temporary audit formatter [skip audit-format]' || true
          git push origin HEAD:fix/claude-audit-complete
