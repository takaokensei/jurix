name: Production Hardening v2

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  production-hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SKIP_DOTENV: "1"
      DEBUG: "False"
      DJANGO_SECRET_KEY: github-actions-jurix-nonproduction-secret
      ALLOWED_HOSTS: localhost,127.0.0.1
      USE_SQLITE: "False"
      USE_LOCMEM_CACHE: "False"
      STORAGE_BACKEND: local
      JURIX_ATTACHMENT_ROOT: /tmp/jurix-attachments
      OLLAMA_MODEL: llama3
      OLLAMA_ALLOWED_MODELS: llama3
      OLLAMA_BASE_URL: http://127.0.0.1:11434
      SAPL_BASE_URL: https://example.invalid
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt

      - name: Static security audit
        run: python scripts/security_audit_v2.py --json security-audit.json

      - name: Architecture budgets
        run: python scripts/architecture_budget_v2.py --json architecture-budget.json

      - name: Service contracts
        run: python scripts/check_service_contracts_v2.py

      - name: Ruff
        run: python -m ruff check .

      - name: Production preflight
        run: python manage.py production_preflight_v2 --strict --skip-db

      - name: Focused hardening tests
        run: >
          python -m pytest
          src/tests/test_rag_release_policy_v2.py
          src/tests/test_rag_eval_engine_v2.py
          src/tests/test_production_integrity_v2.py
