[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jurix"
version = "1.2.0"
description = "Sistema de Consolidação Normativa e Rastreabilidade Jurídica Inteligente (PIBIC/UFRN)"
authors = [
    { name = "Cauã Vitor F. Silva", email = "cauavitorfigueredo@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    "venv",
    ".venv",
    "*/migrations/*",
    "data/*",
    "staticfiles/*",
    "src/apps/core/static/js/vendor/*",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "DJ",   # flake8-django
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "DJ001", # django-nullable-model-string-field
]

[tool.ruff.lint.isort]
known-first-party = ["src", "config", "legislation", "ingestion", "core", "processing", "llm_engine", "clients"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "--reuse-db -v"
markers = [
    "unit: fast tests without external services",
    "integration: tests requiring Django/database services",
    "browser: real browser tests",
]
testpaths = ["src/tests"]
DJANGO_SETTINGS_MODULE = "config.settings"
